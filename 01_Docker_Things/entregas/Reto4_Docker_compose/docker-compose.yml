version: "3.9"

services:

  mongo:
    image: mongo:4.4
    container_name: mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - lemoncode-network

  topics-api:
    build:
      context: ./backend
    container_name: topics-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: mongodb://mongo:27017
      DATABASE_NAME: ClassesDb
      PORT: 5000
    depends_on:
      - mongo
    networks:
      - lemoncode-network

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      API_URL: http://topics-api:5000/api/classes
    depends_on:
      - topics-api
    networks:
      - lemoncode-network

networks:
  lemoncode-network:
    driver: bridge

volumes:
  mongo_data:
